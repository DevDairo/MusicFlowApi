[package]
name = "musicflow-desktop"
version = "0.1.0"
description = "Cliente de escritorio de MusicFlow"
authors = ["MusicFlow contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "musicflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-http = { version = "=2.5.9", features = [] }
