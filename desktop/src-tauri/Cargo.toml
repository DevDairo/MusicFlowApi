[package]
name = "musicflow-desktop"
version = "0.1.0"
description = "Cliente de escritorio de MusicFlow"
authors = ["MusicFlow contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "musicflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "=4.1.6"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-http = { version = "=2.5.9", features = [] }
tauri-plugin-opener = "=2.5.4"
zeroize = "=1.8.2"
