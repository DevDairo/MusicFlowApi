name: musicflow

x-backend-environment: &backend-environment
  MUSICFLOW_ENVIRONMENT: ${MUSICFLOW_ENVIRONMENT:-development}
  MUSICFLOW_LOG_LEVEL: ${MUSICFLOW_LOG_LEVEL:-INFO}
  MUSICFLOW_DB_HOST: postgres
  MUSICFLOW_DB_PORT: 5432
  MUSICFLOW_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
  MUSICFLOW_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  MUSICFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  MUSICFLOW_DB_CONNECT_TIMEOUT_SECONDS: ${MUSICFLOW_DB_CONNECT_TIMEOUT_SECONDS:-3}
  MUSICFLOW_OIDC_ISSUER: ${MUSICFLOW_OIDC_ISSUER:?MUSICFLOW_OIDC_ISSUER is required}
  MUSICFLOW_OIDC_AUDIENCE: ${MUSICFLOW_OIDC_AUDIENCE:-musicflow-api}
  MUSICFLOW_OIDC_JWKS_URL: ${MUSICFLOW_OIDC_JWKS_URL:?MUSICFLOW_OIDC_JWKS_URL is required}
  MUSICFLOW_OIDC_JWKS_CACHE_SECONDS: ${MUSICFLOW_OIDC_JWKS_CACHE_SECONDS:-300}
  MUSICFLOW_OIDC_CLOCK_SKEW_SECONDS: ${MUSICFLOW_OIDC_CLOCK_SKEW_SECONDS:-30}

x-backend-security: &backend-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
    - /run/musicflow:size=1m,uid=10001,gid=10001,mode=0700

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
      - identity-ingress

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: migrations
    depends_on:
      postgres:
        condition: service_healthy
    <<: *backend-security
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MUSICFLOW_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "musicflow.api.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - backend
      - identity-ingress

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: worker
      MUSICFLOW_WORKER_HEARTBEAT_SECONDS: ${MUSICFLOW_WORKER_HEARTBEAT_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "musicflow.worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  tests:
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: tests
    environment:
      <<: *backend-environment
      MUSICFLOW_ENVIRONMENT: test
      MUSICFLOW_SERVICE_NAME: tests
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    networks:
      - backend

  keycloak-postgres:
    image: postgres:18.4-bookworm
    profiles:
      - identity
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - identity-backend

  keycloak:
    build:
      context: ./identity/keycloak
      dockerfile: Dockerfile
    profiles:
      - identity
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-temp-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL:-http://127.0.0.1:8081}
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KEYCLOAK_PROXY_SUBNET:-172.30.53.0/29}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_SERVER_ASYNC_BOOTSTRAP: "false"
      KC_LOG_LEVEL: INFO
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    secrets:
      - keycloak_db_password
      - keycloak_bootstrap_admin_password
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=0,mode=1770
      - /opt/keycloak/data/tmp:size=32m,uid=1000,gid=0,mode=0770
      - /opt/keycloak/data/transaction-logs:size=16m,uid=1000,gid=0,mode=0770
    networks:
      identity-proxy:
      identity-backend:

  keycloak-gateway:
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    profiles:
      - identity
    entrypoint:
      - nginx
    command:
      - -g
      - daemon off;
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    user: "101:101"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0770
    volumes:
      - ./identity/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_GATEWAY_PORT:-8082}:8080"
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8081"
    networks:
      identity-ingress:
      identity-proxy:

volumes:
  postgres-data:
  keycloak-postgres-data:

networks:
  edge:
  backend:
    internal: true
  identity-ingress:
  identity-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${KEYCLOAK_PROXY_SUBNET:-172.30.53.0/29}
  identity-backend:
    internal: true

secrets:
  cloudflare_tunnel_token:
    file: ./.secrets/cloudflare-tunnel-token
  keycloak_db_password:
    file: ./.secrets/keycloak-db-password
  keycloak_bootstrap_admin_password:
    file: ./.secrets/keycloak-bootstrap-admin-password
