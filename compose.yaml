name: musicflow

x-backend-environment: &backend-environment
  MUSICFLOW_ENVIRONMENT: ${MUSICFLOW_ENVIRONMENT:-development}
  MUSICFLOW_LOG_LEVEL: ${MUSICFLOW_LOG_LEVEL:-INFO}
  MUSICFLOW_DB_HOST: postgres
  MUSICFLOW_DB_PORT: 5432
  MUSICFLOW_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
  MUSICFLOW_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  MUSICFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  MUSICFLOW_DB_CONNECT_TIMEOUT_SECONDS: ${MUSICFLOW_DB_CONNECT_TIMEOUT_SECONDS:-3}

x-backend-security: &backend-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
    - /run/musicflow:size=1m,uid=10001,gid=10001,mode=0700

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: migrations
    depends_on:
      postgres:
        condition: service_healthy
    <<: *backend-security
    restart: "no"
    networks:
      - backend

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MUSICFLOW_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "musicflow.api.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - backend

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *backend-environment
      MUSICFLOW_SERVICE_NAME: worker
      MUSICFLOW_WORKER_HEARTBEAT_SECONDS: ${MUSICFLOW_WORKER_HEARTBEAT_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "musicflow.worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  tests:
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: tests
    environment:
      <<: *backend-environment
      MUSICFLOW_ENVIRONMENT: test
      MUSICFLOW_SERVICE_NAME: tests
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *backend-security
    networks:
      - backend

volumes:
  postgres-data:

networks:
  edge:
  backend:
    internal: true
