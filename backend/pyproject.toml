[project]
name = "musicflow-backend"
version = "0.1.0"
description = "MusicFlow API and background worker"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL service",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["INP001"]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
