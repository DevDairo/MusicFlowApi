worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout combined;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream keycloak_upstream {
        server keycloak:8080;
        keepalive 16;
    }

    map $http_host $admin_forwarded_port {
        ~:(\d+)$ $1;
        default 80;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location ^~ /realms/musicflow/ {
            proxy_pass http://keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host auth.kontora-pos.store;
            proxy_set_header X-Forwarded-Host auth.kontora-pos.store;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /resources/ {
            proxy_pass http://keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host auth.kontora-pos.store;
            proxy_set_header X-Forwarded-Host auth.kontora-pos.store;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8081;
        server_name _;

        location = /gateway-health {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Port $admin_forwarded_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
